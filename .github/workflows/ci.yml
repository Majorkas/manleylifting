name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Run Django system checks
        working-directory: backend
        run: uv run python manage.py check

      - name: Run Django tests
        working-directory: backend
        run: uv run python manage.py test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    env:
      # Tests mock @stripe/stripe-js and never make a real network call; this
      # placeholder only satisfies CheckoutPage's truthy env-var check so the
      # payment form renders instead of short-circuiting to a config error.
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_replace
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check performance budget
        working-directory: frontend
        run: npm run perf:budget
